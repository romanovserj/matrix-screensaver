<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Matrix</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #000; overflow: hidden; cursor: none; }
  canvas { display: block; width: 100vw; height: 100vh; }
</style>
</head>
<body>
<canvas id="m"></canvas>
<script>
const CHARS = 'アイウエオカキクケコサシスセソタチツテトナニヌネノハヒフヘホマミムメモヤユヨラリルレロワヲン0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ*+-<>:=';
const HUE_CYCLE_SEC = 75;
const ENERGY_SIZE = 256;

const canvas = document.getElementById('m');
const gl = canvas.getContext('webgl', { antialias: false });

const VSH = `
attribute vec2 aPos;
varying vec2 vUv;
void main() {
  vUv = aPos * 0.5 + 0.5;
  gl_Position = vec4(aPos, 0.0, 1.0);
}`;

const FSH = `
precision highp float;
varying vec2 vUv;
uniform float uT;
uniform vec2 uRes;
uniform float uDpr;
uniform sampler2D uAtlas;
uniform sampler2D uVideo;
uniform sampler2D uLut;
uniform sampler2D uEnergy;
uniform float uCam;
uniform vec2 uVidRes;

float hash11(float p) {
  p = fract(p * 0.1031);
  p *= p + 33.33;
  p *= p + p;
  return fract(p);
}

float hash21(vec2 p) {
  vec3 p3 = fract(vec3(p.xyx) * 0.1031);
  p3 += dot(p3, p3.yzx + 33.33);
  return fract((p3.x + p3.y) * p3.z);
}

vec3 hsv2rgb(vec3 c) {
  vec4 K = vec4(1.0, 2.0 / 3.0, 1.0 / 3.0, 3.0);
  vec3 p = abs(fract(c.xxx + K.xyz) * 6.0 - K.www);
  return c.z * mix(K.xxx, clamp(p - K.xxx, 0.0, 1.0), c.y);
}

vec2 videoUV(vec2 p) {
  float sAspect = uRes.x / uRes.y;
  float vAspect = uVidRes.x / uVidRes.y;
  vec2 vuv = p;
  if (sAspect > vAspect) {
    vuv.y = (vuv.y - 0.5) * (vAspect / sAspect) + 0.5;
  } else {
    vuv.x = (vuv.x - 0.5) * (sAspect / vAspect) + 0.5;
  }
  vuv.x = 1.0 - vuv.x;
  return vuv;
}

vec3 layer(vec2 uv, float cells, float speed, float trail, float seed, float hueBase) {
  float rows = cells * uRes.y / uRes.x;
  float col = floor(uv.x * cells);
  float row = floor(uv.y * rows);

  float colSeed = hash11(col * 7.13 + seed * 101.7);
  float spd = speed * (0.5 + colSeed * 0.8);

  float head = fract(uT * spd + colSeed * 19.7) * rows;
  float d = mod(head - row, rows);
  float bright = exp(-d * 4.0 / trail);

  float flickRate = 1.5 + 2.5 * hash21(vec2(row, col) + seed);
  float gRnd = hash21(vec2(col + seed * 13.0, row * 1.7) + floor(uT * flickRate));
  float gi = floor(gRnd * 63.99);
  vec2 g = vec2(mod(gi, 8.0), floor(gi / 8.0));

  vec2 local = fract(vec2(uv.x * cells, uv.y * rows));
  vec2 auv = (g + vec2(local.x, local.y)) / 8.0;
  float glyph = texture2D(uAtlas, auv).r;
  float glow = texture2D(uAtlas, auv, 3.0).r;

  float hue = fract(hueBase + uv.x * 0.10 + seed * 0.04);
  vec3 c = hsv2rgb(vec3(hue, 0.85, 1.0));

  vec3 result = glyph * bright * c + glow * bright * c * 0.8;
  float headF = smoothstep(1.6, 0.0, d);
  result += (glyph + glow * 0.9) * headF * mix(c, vec3(1.0), 0.75);
  return result;
}

void main() {
  vec2 uv = vec2(vUv.x, 1.0 - vUv.y);
  float hueBase = uT / ${HUE_CYCLE_SEC.toFixed(1)};

  vec2 uvR = uv;
  if (uCam > 0.5) {
    float eHere = texture2D(uEnergy, videoUV(uv)).r;
    uvR.x += eHere * 0.012 * sin(uT * 4.0 + uv.y * 30.0);
    uvR.y += eHere * 0.035;
  }

  vec3 col = vec3(0.0);
  col += layer(uvR, uRes.x / (14.0 * uDpr), 0.040, 10.0, 3.0, hueBase) * 0.25;
  col += layer(uvR, uRes.x / (22.0 * uDpr), 0.070, 14.0, 2.0, hueBase) * 0.50;
  col += layer(uvR, uRes.x / (36.0 * uDpr), 0.130, 18.0, 1.0, hueBase) * 1.00;

  if (uCam > 0.5) {
    float cellsC = uRes.x / (14.0 * uDpr);
    float rowsC = cellsC * uRes.y / uRes.x;
    vec2 cuv = (floor(uv * vec2(cellsC, rowsC)) + 0.5) / vec2(cellsC, rowsC);
    vec2 vuv = videoUV(cuv);

    float energy = texture2D(uEnergy, vuv).r;
    vec2 px = 2.0 / uVidRes;
    vec3 v = texture2D(uVideo, vuv).rgb * 0.4
           + texture2D(uVideo, vuv + vec2(px.x, 0.0)).rgb * 0.15
           + texture2D(uVideo, vuv - vec2(px.x, 0.0)).rgb * 0.15
           + texture2D(uVideo, vuv + vec2(0.0, px.y)).rgb * 0.15
           + texture2D(uVideo, vuv - vec2(0.0, px.y)).rgb * 0.15;
    float lum = dot(v, vec3(0.299, 0.587, 0.114));
    lum = pow(lum, 1.3);

    float rank = floor(lum * 15.99) * 4.0 + 2.0;
    float gi = floor(texture2D(uLut, vec2((rank + 0.5) / 64.0, 0.5)).r * 255.0 + 0.5);
    vec2 g = vec2(mod(gi, 8.0), floor(gi / 8.0));
    vec2 local = fract(uv * vec2(cellsC, rowsC));
    vec2 auv = (g + local) / 8.0;
    float glyph = texture2D(uAtlas, auv).r;
    float glow = texture2D(uAtlas, auv, 3.0).r;

    float rainLum = clamp(dot(col, vec3(0.5)), 0.0, 1.0);
    vec3 ac = hsv2rgb(vec3(fract(hueBase + 0.5), 0.45, 1.0));

    col *= (1.0 - lum * 0.45);
    col += (glyph + glow * 0.5) * lum * ac * (0.35 + 1.8 * rainLum);
    col += (glyph + glow * 0.8) * energy * 1.8;
  }

  float vig = 1.0 - 0.45 * length(vUv - 0.5);
  col *= vig;

  col = col / (1.0 + col * 0.35);
  gl_FragColor = vec4(col, 1.0);
}`;

const EFSH = `
precision mediump float;
varying vec2 vUv;
uniform sampler2D uVideo;
uniform sampler2D uVideoPrev;
uniform sampler2D uEnergyPrev;
void main() {
  vec3 c = texture2D(uVideo, vUv).rgb;
  vec3 p = texture2D(uVideoPrev, vUv).rgb;
  float diff = abs(dot(c - p, vec3(0.299, 0.587, 0.114)));
  diff = smoothstep(0.05, 0.3, diff);
  float prev = texture2D(uEnergyPrev, vUv).r;
  gl_FragColor = vec4(max(prev * 0.95, diff), 0.0, 0.0, 1.0);
}`;

function makeAtlas() {
  const c = document.createElement('canvas');
  c.width = c.height = 1024;
  const x = c.getContext('2d');
  x.fillStyle = '#000';
  x.fillRect(0, 0, 1024, 1024);
  x.fillStyle = '#fff';
  x.font = "88px 'SF Mono', Menlo, monospace";
  x.textAlign = 'center';
  x.textBaseline = 'middle';
  for (let i = 0; i < 64; i++) {
    const ch = CHARS[i % CHARS.length];
    const cx = (i % 8) * 128 + 64;
    const cy = Math.floor(i / 8) * 128 + 64;
    x.fillText(ch, cx, cy);
  }
  return c;
}

const atlasCanvas = makeAtlas();

function glyphDensityLut() {
  const x = atlasCanvas.getContext('2d');
  const order = [];
  for (let i = 0; i < 64; i++) {
    const d = x.getImageData((i % 8) * 128, Math.floor(i / 8) * 128, 128, 128).data;
    let s = 0;
    for (let j = 0; j < d.length; j += 16) s += d[j];
    order.push([s, i]);
  }
  order.sort((a, b) => a[0] - b[0]);
  return new Uint8Array(order.map(o => o[1]));
}

function compile(type, src) {
  const s = gl.createShader(type);
  gl.shaderSource(s, src);
  gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) {
    throw new Error(gl.getShaderInfoLog(s));
  }
  return s;
}

function makeProgram(fsh) {
  const p = gl.createProgram();
  gl.attachShader(p, compile(gl.VERTEX_SHADER, VSH));
  gl.attachShader(p, compile(gl.FRAGMENT_SHADER, fsh));
  gl.bindAttribLocation(p, 0, 'aPos');
  gl.linkProgram(p);
  if (!gl.getProgramParameter(p, gl.LINK_STATUS)) {
    throw new Error(gl.getProgramInfoLog(p));
  }
  return p;
}

const prog = makeProgram(FSH);
const energyProg = makeProgram(EFSH);

const buf = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, buf);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
gl.enableVertexAttribArray(0);
gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);

function setTexParams(filter) {
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, filter);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, filter);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
}

gl.activeTexture(gl.TEXTURE0);
const atlasTex = gl.createTexture();
gl.bindTexture(gl.TEXTURE_2D, atlasTex);
gl.texImage2D(gl.TEXTURE_2D, 0, gl.LUMINANCE, gl.LUMINANCE, gl.UNSIGNED_BYTE, atlasCanvas);
gl.generateMipmap(gl.TEXTURE_2D);
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR_MIPMAP_LINEAR);
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);

const vidTex = [];
for (let i = 0; i < 2; i++) {
  gl.activeTexture(i === 0 ? gl.TEXTURE1 : gl.TEXTURE3);
  vidTex[i] = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, vidTex[i]);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGB, 1, 1, 0, gl.RGB, gl.UNSIGNED_BYTE, new Uint8Array([0, 0, 0]));
  setTexParams(gl.LINEAR);
}

gl.activeTexture(gl.TEXTURE2);
const lutTex = gl.createTexture();
gl.bindTexture(gl.TEXTURE_2D, lutTex);
gl.texImage2D(gl.TEXTURE_2D, 0, gl.LUMINANCE, 64, 1, 0, gl.LUMINANCE, gl.UNSIGNED_BYTE, glyphDensityLut());
setTexParams(gl.NEAREST);

const energyTex = [];
const energyFbo = [];
for (let i = 0; i < 2; i++) {
  gl.activeTexture(gl.TEXTURE4);
  energyTex[i] = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, energyTex[i]);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, ENERGY_SIZE, ENERGY_SIZE, 0, gl.RGBA, gl.UNSIGNED_BYTE, null);
  setTexParams(gl.LINEAR);
  energyFbo[i] = gl.createFramebuffer();
  gl.bindFramebuffer(gl.FRAMEBUFFER, energyFbo[i]);
  gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, energyTex[i], 0);
}
gl.bindFramebuffer(gl.FRAMEBUFFER, null);

gl.useProgram(energyProg);
const eUVideo = gl.getUniformLocation(energyProg, 'uVideo');
const eUVideoPrev = gl.getUniformLocation(energyProg, 'uVideoPrev');
gl.uniform1i(gl.getUniformLocation(energyProg, 'uEnergyPrev'), 4);

gl.useProgram(prog);
const uT = gl.getUniformLocation(prog, 'uT');
const uRes = gl.getUniformLocation(prog, 'uRes');
const uDpr = gl.getUniformLocation(prog, 'uDpr');
const uCam = gl.getUniformLocation(prog, 'uCam');
const uVidRes = gl.getUniformLocation(prog, 'uVidRes');
const uVideoLoc = gl.getUniformLocation(prog, 'uVideo');
gl.uniform1i(gl.getUniformLocation(prog, 'uAtlas'), 0);
gl.uniform1i(gl.getUniformLocation(prog, 'uLut'), 2);
gl.uniform1i(gl.getUniformLocation(prog, 'uEnergy'), 4);
gl.uniform1i(uVideoLoc, 1);
gl.uniform1f(uCam, 0);

const video = document.createElement('video');
video.muted = true;
video.playsInline = true;
let camReady = false;
if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
  navigator.mediaDevices.getUserMedia({ video: { width: 640 } })
    .then(stream => { video.srcObject = stream; return video.play(); })
    .then(() => { camReady = true; })
    .catch(() => {});
}

function resize() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width = window.innerWidth * dpr;
  canvas.height = window.innerHeight * dpr;
  gl.useProgram(prog);
  gl.uniform2f(uRes, canvas.width, canvas.height);
  gl.uniform1f(uDpr, dpr);
}
window.addEventListener('resize', resize);
resize();

let vidIdx = 0;
let eWrite = 0;

function loop(t) {
  if (camReady && video.readyState >= 2) {
    vidIdx = 1 - vidIdx;
    const unit = vidIdx === 0 ? 1 : 3;
    gl.activeTexture(gl.TEXTURE0 + unit);
    gl.bindTexture(gl.TEXTURE_2D, vidTex[vidIdx]);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGB, gl.RGB, gl.UNSIGNED_BYTE, video);

    gl.useProgram(energyProg);
    gl.uniform1i(eUVideo, unit);
    gl.uniform1i(eUVideoPrev, unit === 1 ? 3 : 1);
    gl.activeTexture(gl.TEXTURE4);
    gl.bindTexture(gl.TEXTURE_2D, energyTex[1 - eWrite]);
    gl.bindFramebuffer(gl.FRAMEBUFFER, energyFbo[eWrite]);
    gl.viewport(0, 0, ENERGY_SIZE, ENERGY_SIZE);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);

    gl.useProgram(prog);
    gl.activeTexture(gl.TEXTURE4);
    gl.bindTexture(gl.TEXTURE_2D, energyTex[eWrite]);
    gl.uniform1i(uVideoLoc, unit);
    gl.uniform1f(uCam, 1);
    gl.uniform2f(uVidRes, video.videoWidth, video.videoHeight);
    eWrite = 1 - eWrite;
  } else {
    gl.useProgram(prog);
  }
  gl.viewport(0, 0, canvas.width, canvas.height);
  gl.uniform1f(uT, t / 1000);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
